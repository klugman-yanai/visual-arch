<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Architecture</title>
    <link rel="stylesheet" href="https://unpkg.com/@xyflow/react@12.10.2/dist/style.css" />
    <style>
      :root {
        color-scheme: light;
        --canvas: #f7f6f2;
        --canvas-strong: #ece9df;
        --surface: #fffefa;
        --surface-2: #f2f0e8;
        --ink: #171717;
        --muted: #65625c;
        --quiet: #918d84;
        --line: #d8d4c8;
        --grid: rgba(93, 88, 76, 0.09);
        --swim-line: rgba(93, 88, 76, 0.16);
        --shadow: 0 22px 60px rgba(34, 31, 24, 0.13);
        --github: #5c5fb8;
        --package: #2f6f91;
        --runtime: #0f8b72;
        --storage: #b77b1b;
        --signal: #bf3b5f;
        --decision: #7a5a25;
        --infra: #59636f;
        --panel-bg: rgba(255, 254, 250, 0.9);
        --panel-border: rgba(78, 74, 65, 0.16);
        --button-hover-bg: rgba(23, 23, 23, 0.04);
        --button-active-bg: #171717;
        --button-active-fg: #fffefa;
        --card-bg: #f7f4ed;
        --chip-bg: #f6f3eb;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #24231f;
        --canvas-strong: #302e29;
        --surface: #302f2a;
        --surface-2: #3a3832;
        --ink: #f3eee4;
        --muted: #c8c0b1;
        --quiet: #a89f91;
        --line: #565247;
        --grid: rgba(228, 220, 205, 0.08);
        --swim-line: rgba(228, 220, 205, 0.13);
        --shadow: 0 22px 64px rgba(0, 0, 0, 0.32);
        --github: #9a8dff;
        --package: #63a8ca;
        --runtime: #4cc7aa;
        --storage: #e1b85a;
        --signal: #f08aa3;
        --decision: #d0aa70;
        --infra: #a8b0b8;
        --panel-bg: rgba(48, 47, 42, 0.9);
        --panel-border: rgba(243, 238, 228, 0.13);
        --button-hover-bg: rgba(243, 238, 228, 0.07);
        --button-active-bg: #f3eee4;
        --button-active-fg: #24231f;
        --card-bg: #38362f;
        --chip-bg: #38362f;
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --canvas: #f7f6f2;
        --canvas-strong: #ece9df;
        --surface: #fffefa;
        --surface-2: #f2f0e8;
        --ink: #171717;
        --muted: #65625c;
        --quiet: #918d84;
        --line: #d8d4c8;
        --grid: rgba(93, 88, 76, 0.09);
        --swim-line: rgba(93, 88, 76, 0.16);
        --shadow: 0 22px 60px rgba(34, 31, 24, 0.13);
        --github: #5c5fb8;
        --package: #2f6f91;
        --runtime: #0f8b72;
        --storage: #b77b1b;
        --signal: #bf3b5f;
        --decision: #7a5a25;
        --infra: #59636f;
        --panel-bg: rgba(255, 254, 250, 0.9);
        --panel-border: rgba(78, 74, 65, 0.16);
        --button-hover-bg: rgba(23, 23, 23, 0.04);
        --button-active-bg: #171717;
        --button-active-fg: #fffefa;
        --card-bg: #f7f4ed;
        --chip-bg: #f6f3eb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--canvas);
        color: var(--ink);
        font:
          14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      button {
        font: inherit;
      }

      #root {
        width: 100vw;
        height: 100vh;
      }

      #boot-fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 28px;
        background: var(--canvas);
        color: var(--ink);
        z-index: 50;
      }

      body.app-ready #boot-fallback {
        display: none;
      }

      .fallback-card {
        max-width: 720px;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: var(--panel-bg);
        box-shadow: var(--shadow);
        padding: 28px;
      }

      .fallback-card h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      .fallback-card p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .app-shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(180deg, color-mix(in srgb, var(--surface) 72%, var(--canvas)) 0%, var(--canvas) 100%);
      }

      .topbar {
        position: absolute;
        inset: 14px 14px auto 14px;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(220px, 0.9fr) minmax(360px, 1.5fr) auto;
        gap: 12px;
        align-items: center;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: var(--panel-bg);
        box-shadow: 0 14px 34px rgba(34, 31, 24, 0.1);
        padding: 10px 12px;
        backdrop-filter: blur(14px);
      }

      .brand {
        min-width: 0;
      }

      .brand-kicker {
        color: var(--quiet);
        display: block;
        font-size: 0.68rem;
        font-weight: 850;
        letter-spacing: 0.15em;
        line-height: 1;
        text-transform: uppercase;
      }

      .brand-title {
        display: block;
        margin-top: 5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 1.05rem;
        font-weight: 900;
        letter-spacing: -0.01em;
      }

      .toolbar-cluster {
        min-width: 0;
      }

      .toolbar-label {
        color: var(--quiet);
        display: block;
        margin-bottom: 4px;
        font-size: 0.64rem;
        font-weight: 950;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .mode-tabs,
      .view-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .mode-tabs {
        flex-wrap: wrap;
      }

      .toolbar-button {
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        min-height: 34px;
        padding: 7px 10px;
        font-size: 0.82rem;
        font-weight: 800;
        white-space: nowrap;
      }

      .toolbar-button:hover {
        border-color: rgba(23, 23, 23, 0.14);
        background: var(--button-hover-bg);
      }

      .toolbar-button.is-active {
        border-color: rgba(23, 23, 23, 0.2);
        background: var(--button-active-bg);
        color: var(--button-active-fg);
      }

      .toolbar-button.is-icon {
        display: inline-grid;
        place-items: center;
        width: 34px;
        padding-inline: 0;
        line-height: 1;
      }

      .toolbar-button svg,
      .drawer-close svg {
        display: block;
        width: 16px;
        height: 16px;
        stroke-width: 2.25;
      }

      .flow-wrap {
        position: relative;
        z-index: 4;
        width: 100%;
        height: 100%;
      }

      .react-flow {
        background: transparent;
      }

      .react-flow__pane {
        cursor: grab;
      }

      .react-flow__pane:active {
        cursor: grabbing;
      }

      .react-flow__controls {
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        box-shadow: 0 12px 30px rgba(34, 31, 24, 0.12);
        overflow: hidden;
      }

      .react-flow__controls button {
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        border-bottom-color: rgba(78, 74, 65, 0.12);
        color: var(--ink);
      }

      .react-flow__minimap {
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: var(--panel-bg);
        box-shadow: 0 12px 30px rgba(34, 31, 24, 0.1);
        overflow: hidden;
      }

      .lane-node {
        width: var(--lane-width, 300px);
        height: var(--lane-height, 2600px);
        border-inline: 1px solid var(--swim-line);
        border-top: 4px solid var(--accent);
        background: linear-gradient(
          180deg,
          color-mix(in srgb, var(--accent) 8%, transparent) 0%,
          color-mix(in srgb, var(--accent) 4%, transparent) 18%,
          transparent 72%
        );
        pointer-events: none;
      }

      .lane-title {
        padding: 14px 0 0 18px;
        color: #37322c;
        font-size: 0.74rem;
        font-weight: 950;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .lane-subtitle {
        display: none;
        max-width: 230px;
        padding: 5px 0 0 18px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .arch-node {
        width: 220px;
        min-height: 74px;
        border: 1px solid color-mix(in srgb, var(--accent) 42%, #afa99d);
        border-top: 5px solid var(--accent);
        border-radius: 8px;
        background: color-mix(in srgb, var(--soft) 38%, #fffefa);
        box-shadow: 0 12px 30px rgba(34, 31, 24, 0.1);
        color: var(--ink);
        overflow: hidden;
        transition:
          opacity 160ms ease,
          filter 160ms ease,
          box-shadow 160ms ease,
          transform 160ms ease,
          border-color 160ms ease;
      }

      .arch-node.is-selected {
        border-color: var(--accent);
        box-shadow:
          0 22px 52px rgba(34, 31, 24, 0.2),
          0 0 0 4px color-mix(in srgb, var(--accent) 19%, transparent);
      }

      .arch-node.is-related:not(.is-selected) {
        box-shadow:
          0 16px 38px rgba(34, 31, 24, 0.13),
          0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent);
      }

      .arch-node.is-dimmed {
        filter: saturate(0.68);
        opacity: 0.34;
      }

      .node-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px 0;
      }

      .node-domain {
        color: color-mix(in srgb, var(--accent) 78%, #171717);
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.62rem;
        font-weight: 950;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .node-step {
        display: none;
        border-radius: 7px;
        background: color-mix(in srgb, var(--accent) 86%, #171717);
        color: #fffefa;
        font-size: 0.7rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        padding: 4px 8px;
      }

      .node-body {
        padding: 8px 12px 12px;
      }

      .node-title {
        margin: 0;
        font-size: 1.24rem;
        font-weight: 950;
        letter-spacing: -0.015em;
        line-height: 1.12;
      }

      .node-start {
        display: none;
        margin-bottom: 6px;
        border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 12%, transparent);
        color: color-mix(in srgb, var(--accent) 78%, var(--ink));
        padding: 2px 7px;
        font-size: 0.62rem;
        font-weight: 950;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .node-purpose {
        display: none;
        margin: 6px 0 0;
        color: #514d46;
        font-size: 0.84rem;
        line-height: 1.28;
      }

      .node-chips {
        display: none;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }

      .chip {
        max-width: 100%;
        border: 1px solid rgba(78, 74, 65, 0.13);
        border-radius: 999px;
        background: rgba(255, 254, 250, 0.66);
        color: #444039;
        overflow: hidden;
        padding: 5px 8px;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.74rem;
        font-weight: 800;
      }

      .react-flow__handle {
        width: 10px;
        height: 10px;
        border: 2px solid rgba(255, 254, 250, 0.96);
        background: var(--accent);
        opacity: 0.28;
        pointer-events: none;
      }

      .arch-node:hover .react-flow__handle,
      .arch-node.is-selected .react-flow__handle {
        opacity: 0.9;
      }

      .contract-edge {
        transition:
          opacity 160ms ease,
          stroke 160ms ease,
          stroke-width 160ms ease;
      }

      .edge-label {
        position: absolute;
        border: 1px solid rgba(78, 74, 65, 0.13);
        border-radius: 999px;
        background: rgba(255, 254, 250, 0.9);
        box-shadow: 0 8px 20px rgba(34, 31, 24, 0.09);
        color: #4a453d;
        font-size: 0.72rem;
        font-weight: 850;
        padding: 4px 8px;
        pointer-events: none;
        white-space: nowrap;
      }

      .detail-drawer {
        position: absolute;
        z-index: 18;
        top: 88px;
        right: 14px;
        width: min(520px, calc(100vw - 28px));
        max-height: calc(100vh - 108px);
        display: flex;
        flex-direction: column;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: color-mix(in srgb, var(--surface) 94%, transparent);
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(16px);
        transition:
          opacity 160ms ease,
          transform 160ms ease,
          filter 160ms ease,
          z-index 0ms linear 120ms;
      }

      .app-shell.is-navigating .detail-drawer {
        z-index: 1;
        opacity: 0.08;
        pointer-events: none;
        transform: translateX(18px) scale(0.99);
        filter: saturate(0.65);
      }

      .select-hint {
        position: absolute;
        right: 18px;
        bottom: 118px;
        z-index: 12;
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        background: var(--panel-bg);
        box-shadow: 0 12px 28px rgba(34, 31, 24, 0.1);
        color: var(--muted);
        padding: 10px 12px;
        font-size: 0.86rem;
        font-weight: 800;
        backdrop-filter: blur(12px);
        transition:
          opacity 160ms ease,
          transform 160ms ease;
      }

      .app-shell.is-navigating .select-hint {
        opacity: 0;
        transform: translateY(8px);
      }

      .drawer-head {
        border-top: 5px solid var(--accent, var(--infra));
        border-bottom: 1px solid rgba(78, 74, 65, 0.12);
        padding: 17px 18px 15px;
      }

      .drawer-head-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .drawer-close {
        display: inline-grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border: 1px solid rgba(78, 74, 65, 0.14);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        line-height: 1;
        padding: 0;
      }

      .drawer-close:hover {
        border-color: rgba(23, 23, 23, 0.24);
        color: var(--ink);
      }

      .drawer-kicker {
        color: color-mix(in srgb, var(--accent, var(--infra)) 78%, #171717);
        display: block;
        font-size: 0.68rem;
        font-weight: 950;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .drawer-title {
        margin: 8px 0 0;
        font-size: 1.5rem;
        font-weight: 950;
        letter-spacing: -0.035em;
        line-height: 1.03;
      }

      .drawer-purpose {
        margin: 9px 0 0;
        color: #514d46;
        font-size: 0.96rem;
      }

      .drawer-body {
        overflow: auto;
        padding: 6px 18px 18px;
      }

      .detail-section {
        border-bottom: 1px solid rgba(78, 74, 65, 0.12);
        padding: 14px 0;
      }

      .detail-section:last-child {
        border-bottom: 0;
      }

      .detail-section h3 {
        margin: 0;
        color: var(--quiet);
        font-size: 0.72rem;
        font-weight: 950;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .detail-section ul {
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
      }

      .detail-section li {
        color: var(--muted);
        margin-top: 8px;
      }

      .detail-section p {
        margin: 9px 0 0;
        color: var(--muted);
      }

      .io-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .io-card {
        border: 1px solid rgba(78, 74, 65, 0.12);
        border-radius: 8px;
        background: var(--card-bg);
        padding: 12px;
      }

      .io-card ul {
        margin-top: 8px;
      }

      .source-list {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 10px;
      }

      .source-chip {
        border: 1px solid rgba(78, 74, 65, 0.13);
        border-radius: 6px;
        background: var(--chip-bg);
        color: var(--ink);
        padding: 6px 8px;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-size: 0.74rem;
      }

      .related-list {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 11px;
      }

      .related-pill {
        border: 1px solid rgba(78, 74, 65, 0.13);
        border-radius: 999px;
        background: var(--chip-bg);
        color: var(--ink);
        cursor: pointer;
        padding: 6px 9px;
        font-size: 0.78rem;
        font-weight: 850;
      }

      .related-pill:hover {
        border-color: rgba(23, 23, 23, 0.24);
        background: #fffefa;
      }

      .empty-detail {
        color: var(--muted);
        padding: 18px;
      }

      .empty-detail strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink);
        font-size: 1.1rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #24231f;
          --canvas-strong: #302e29;
          --surface: #302f2a;
          --surface-2: #3a3832;
          --ink: #f3eee4;
          --muted: #c8c0b1;
          --quiet: #a89f91;
          --line: #565247;
          --grid: rgba(228, 220, 205, 0.08);
          --swim-line: rgba(228, 220, 205, 0.13);
          --shadow: 0 22px 64px rgba(0, 0, 0, 0.32);
          --github: #9a8dff;
          --package: #63a8ca;
          --runtime: #4cc7aa;
          --storage: #e1b85a;
          --signal: #f08aa3;
          --decision: #d0aa70;
          --infra: #a8b0b8;
        }

        body {
          background: var(--canvas);
        }

        #boot-fallback {
          background: var(--canvas);
        }

        .fallback-card,
        .topbar,
        .detail-drawer,
        .select-hint {
          border-color: rgba(243, 238, 228, 0.13);
          background: rgba(48, 47, 42, 0.9);
          box-shadow: var(--shadow);
        }

        .app-shell {
          background:
            radial-gradient(circle at 8% 8%, rgba(154, 141, 255, 0.1), transparent 28rem),
            radial-gradient(circle at 88% 12%, rgba(76, 199, 170, 0.08), transparent 30rem),
            linear-gradient(180deg, #292823 0%, var(--canvas) 100%);
        }

        .toolbar-button {
          color: var(--ink);
        }

        .toolbar-button:hover {
          border-color: rgba(243, 238, 228, 0.18);
          background: rgba(243, 238, 228, 0.07);
        }

        .toolbar-button.is-active {
          border-color: rgba(243, 238, 228, 0.3);
          background: var(--ink);
          color: #24231f;
        }

        .react-flow__controls {
          border-color: rgba(243, 238, 228, 0.13);
        }

        .react-flow__controls button {
          background: rgba(48, 47, 42, 0.94);
          border-bottom-color: rgba(243, 238, 228, 0.11);
          color: var(--ink);
        }

        .lane-title,
        .brand-title {
          color: var(--ink);
        }

        .arch-node {
          border-color: color-mix(in srgb, var(--accent) 52%, #5f5a4f);
          background: color-mix(in srgb, var(--accent) 14%, var(--surface));
          box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
        }

        .arch-node.is-selected {
          box-shadow:
            0 22px 52px rgba(0, 0, 0, 0.35),
            0 0 0 4px color-mix(in srgb, var(--accent) 24%, transparent);
        }

        .node-domain,
        .drawer-kicker,
        .node-start {
          color: color-mix(in srgb, var(--accent) 78%, #f3eee4);
        }

        .node-step {
          background: color-mix(in srgb, var(--accent) 72%, #f3eee4);
          color: #24231f;
        }

        .node-purpose,
        .drawer-purpose,
        .detail-section li,
        .detail-section p,
        .lane-subtitle {
          color: var(--muted);
        }

        .react-flow__handle {
          border-color: rgba(36, 35, 31, 0.96);
        }

        .edge-label,
        .io-card,
        .source-chip,
        .related-pill {
          border-color: rgba(243, 238, 228, 0.12);
          background: #38362f;
          color: var(--ink);
        }

        .drawer-head,
        .detail-section {
          border-bottom-color: rgba(243, 238, 228, 0.12);
        }

        .drawer-close {
          border-color: rgba(243, 238, 228, 0.14);
          color: var(--muted);
        }

        .drawer-close:hover,
        .related-pill:hover {
          border-color: rgba(243, 238, 228, 0.28);
          background: #403e37;
          color: var(--ink);
        }
      }

      :root[data-theme] body {
        background: var(--canvas);
      }

      :root[data-theme] .fallback-card,
      :root[data-theme] .topbar,
      :root[data-theme] .select-hint {
        border-color: var(--panel-border);
        background: var(--panel-bg);
        box-shadow: var(--shadow);
      }

      function GroupDetailDrawer({ mode, onSelect }) {
        const group = GROUP_DETAILS[mode] || GROUP_DETAILS.overview;
        const domain = DOMAINS[group.domain] || DOMAINS.runtime;
        const focus = group.focus || [];

        return h(
          "aside",
          {
            className: "detail-drawer",
            "aria-live": "polite",
            style: domainVars(group.domain)
          },
          h(
            "div",
            { className: "drawer-head" },
            h("span", { className: "drawer-kicker" }, `Group overview / ${domain.label}`),
            h("h2", { className: "drawer-title" }, group.title),
            h("p", { className: "drawer-purpose" }, group.purpose)
          ),
          h(
            "div",
            { className: "drawer-body" },
            h(
              "section",
              { className: "detail-section" },
              h("h3", null, "What this shows"),
              h("p", null, group.summary)
            ),
            h(
              "section",
              { className: "detail-section" },
              h("h3", null, "Why it matters"),
              h("p", null, group.why)
            ),
            h(
              "section",
              { className: "detail-section" },
              h("h3", null, "Good to know"),
              h("ul", null, group.points.map(item => h("li", { key: item }, item)))
            ),
            mode === "overview"
              ? null
              : h(
                  "section",
                  { className: "detail-section" },
                  h("h3", null, "Highlighted nodes"),
                  h(
                    "div",
                    { className: "related-list" },
                    focus
                      .filter(id => NODE_BY_ID[id])
                      .map(id =>
                        h(
                          "button",
                          {
                            key: id,
                            type: "button",
                            className: "related-pill",
                            onClick: () => onSelect(id)
                          },
                          NODE_BY_ID[id].title
                        )
                      )
                  )
                )
          )
        );
      }

      function DetailDrawer({ mode, selectedId, onSelect, onClose }) {
        const node = selectedId ? NODE_BY_ID[selectedId] : null;
        if (!node) {
          return mode === "overview" ? null : h(GroupDetailDrawer, { mode, onSelect });
        }

        const domain = DOMAINS[node.domain];
        const owner = OWNERS[node.owner] || OWNERS.suite;
        const summary = node.details.summary || node.details.what?.[0] || node.purpose;
        const why = Array.isArray(node.details.why) ? node.details.why.join(" ") : node.details.why;
        const directRelated = directRelations(node.id);

        return h(
          "aside",
          {
            className: "detail-drawer",
            "aria-live": "polite",
            style: domainVars(node.domain)
          },
          h(
            "div",
            { className: "drawer-head" },
            h(
              "div",
              { className: "drawer-head-top" },
              h("span", { className: "drawer-kicker" }, `${owner.label} / ${domain.label}`),
              h(
                "button",
                { type: "button", className: "drawer-close", onClick: onClose, "aria-label": "Close details", title: "Close details" },
                h(X, { "aria-hidden": true })
              )
            ),
            h("h2", { className: "drawer-title" }, node.title),
            h("p", { className: "drawer-purpose" }, node.purpose)
          ),
          h(
            "div",
            { className: "drawer-body" },
            h(
              "section",
              { className: "detail-section" },
              h("h3", null, "What it does"),
              h("p", null, summary)
            ),
            h(
              "section",
              { className: "detail-section" },
              h("h3", null, "Owned by"),
              h("p", null, owner.description)
            ),
            h(
              "section",
              { className: "detail-section" },
              h("h3", null, "Source confidence"),
              h("p", null, node.details.source_confidence || "unknown")
            ),
            h(
              "section",
              { className: "detail-section io-grid" },
              h(
                "div",
                { className: "io-card" },
                h("h3", null, "Reads"),
                h("ul", null, node.details.inputs.map(item => h("li", { key: item }, item)))
              ),
              h(
                "div",
                { className: "io-card" },
                h("h3", null, "Writes"),
                h("ul", null, node.details.outputs.map(item => h("li", { key: item }, item)))
              )
            ),
            h(
              "section",
              { className: "detail-section" },
              h("h3", null, "Why it exists"),
              h("p", null, why)
            ),
            h(
              "section",
              { className: "detail-section" },
              h("h3", null, "Check first if it fails"),
              h("ul", null, node.details.failures.map(item => h("li", { key: item }, item)))
            ),
            h(
              "section",
              { className: "detail-section" },
              h("h3", null, "Where to look"),
              h(
                "div",
                { className: "source-list" },
                node.details.source.map(item => h("span", { key: item, className: "source-chip" }, item))
              )
            ),
            h(
              "section",
              { className: "detail-section" },
              h("h3", null, "Connected steps"),
              h(
                "div",
                { className: "related-list" },
                directRelated.map(id =>
                  h(
                    "button",
                    {
                      key: id,
                      type: "button",
                      className: "related-pill",
                      onClick: () => onSelect(id)
                    },
                    NODE_BY_ID[id].title
                  )
                )
              )
            )
          )
        );
      }

      function directRelations(id) {
        return [...new Set([...(INCOMING.get(id) || []), ...(OUTGOING.get(id) || []), ...(NODE_BY_ID[id]?.details.related || [])])].filter(
          relatedId => NODE_BY_ID[relatedId]
        );
      }

      function Toolbar({
        mode,
        selectedId,
        showDetails,
        theme,
        onModeChange,
        onFitAll,
        onResetLayout,
        onClearSelection,
        onDetailsToggle,
        onThemeToggle
      }) {
        const modes = Object.entries(BOARD.views);

        return h(
          "div",
          { className: "topbar" },
          h(
            "div",
            { className: "brand" },
            h("span", { className: "brand-kicker" }, "Visual architecture"),
            h("span", { className: "brand-title" }, "Project Architecture")
          ),
          h(
            "div",
            { className: "toolbar-cluster" },
            h("span", { className: "toolbar-label" }, "View"),
            h(
              "div",
              { className: "mode-tabs", role: "group", "aria-label": "Choose architecture view" },
              modes.map(([key, value]) =>
                h(
                  "button",
                  {
                    key,
                    type: "button",
                    className: `toolbar-button ${mode === key && !selectedId ? "is-active" : ""}`,
                    "aria-pressed": String(mode === key && !selectedId),
                    onClick: () => onModeChange(key)
                  },
                  value.label
                )
              )
            )
          ),
          h(
            "div",
            { className: "view-actions" },
            h(
              "button",
              { type: "button", className: "toolbar-button is-icon", onClick: onFitAll, "aria-label": "Fit all", title: "Fit all" },
              h(Maximize2, { "aria-hidden": true })
            ),
            h(
              "button",
              { type: "button", className: "toolbar-button is-icon", onClick: onResetLayout, "aria-label": "Reset view", title: "Reset view" },
              h(RotateCcw, { "aria-hidden": true })
            ),
            h(
              "button",
              {
                type: "button",
                className: `toolbar-button ${showDetails ? "is-active" : ""}`,
                onClick: onDetailsToggle,
                "aria-pressed": String(showDetails),
                title: showDetails ? "Hide detail nodes" : "Show detail nodes"
              },
              "Details"
            ),
            h(
              "button",
              {
                type: "button",
                className: "toolbar-button is-icon",
                onClick: onThemeToggle,
                "aria-label": theme === "dark" ? "Switch to light mode" : "Switch to dark mode",
                title: theme === "dark" ? "Light mode" : "Dark mode"
              },
              theme === "dark" ? h(Sun, { "aria-hidden": true }) : h(Moon, { "aria-hidden": true })
            ),
            selectedId
              ? h(
                  "button",
                  { type: "button", className: "toolbar-button is-icon", onClick: onClearSelection, "aria-label": "Clear selection", title: "Clear selection" },
                  h(X, { "aria-hidden": true })
                )
              : null
          )
        );
      }

      function initialTheme() {
        try {
          const saved = window.localStorage.getItem("visual-arch-theme");
          if (saved === "light" || saved === "dark") return saved;
        } catch (_error) {
          // Ignore storage failures; the system preference is a fine fallback.
        }
        return window.matchMedia?.("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      function replaceUrlHash(id) {
        try {
          if (!window.history?.replaceState) return;
          const baseUrl = window.location.href.replace(/#.*$/, "");
          const nextUrl = id ? `${baseUrl}#${encodeURIComponent(id)}` : baseUrl;
          window.history.replaceState(null, "", nextUrl);
        } catch (_error) {
          // Some browsers block history mutation for local files. The board works without URL state.
        }
      }

      function hashSelectionId() {
        try {
          const id = decodeURIComponent(window.location.hash.replace(/^#/, ""));
          return NODE_BY_ID[id] ? id : null;
        } catch (_error) {
          return null;
        }
      }

      function FlowBoard() {
        const [mode, setMode] = useState("overview");
        const [selectedId, setSelectedId] = useState(null);
        const [showDetails, setShowDetails] = useState(false);
        const [resetNonce, setResetNonce] = useState(0);
        const [theme, setTheme] = useState(initialTheme);
        const [isNavigating, setIsNavigating] = useState(false);
        const navigationTimer = useRef(null);
        const didInitialFit = useRef(false);
        const reactFlow = useReactFlow();

        const nodes = useMemo(() => buildNodes(mode, selectedId, showDetails), [mode, selectedId, showDetails, resetNonce]);
        const edges = useMemo(() => buildEdges(mode, selectedId, showDetails), [mode, selectedId, showDetails]);

        const setViewportForIds = useCallback(
          (ids, options = {}) => {
            requestAnimationFrame(() => {
              reactFlow.setViewport(viewportForIds(ids, options), { duration: options.duration ?? 450 });
            });
          },
          [reactFlow]
        );

        const centerNode = useCallback(id => {
          if (!NODE_BY_ID[id]) return;
          setViewportForIds([id], { padding: 0.95, maxZoom: 1.05, duration: 420, includeDetails: true });
        }, [setViewportForIds]);

        const selectNode = useCallback(
          id => {
            if (!NODE_BY_ID[id]) return;
            setSelectedId(id);
            replaceUrlHash(id);
            centerNode(id);
          },
          [centerNode]
        );

        const focusMode = useCallback(
          nextMode => {
            const view = BOARD.views[nextMode] || BOARD.views.overview;
            setMode(nextMode);
            setSelectedId(null);
            replaceUrlHash(null);
            if (nextMode === "overview") {
              setViewportForIds(view.focus, { padding: 0.18, maxZoom: 0.95, reservePanel: false });
            } else {
              setViewportForIds(view.focus, { padding: 0.34, maxZoom: 1.05, includeDetails: true });
            }
          },
          [setViewportForIds]
        );

        const fitAll = useCallback(() => {
          focusMode("overview");
        }, [focusMode]);

        const clearSelection = useCallback(() => {
          setSelectedId(null);
          replaceUrlHash(null);
          if (mode === "overview") {
            setViewportForIds(BOARD.views.overview.focus, { padding: 0.18, maxZoom: 0.95, reservePanel: false });
          } else {
            setViewportForIds((BOARD.views[mode] || BOARD.views.overview).focus, { padding: 0.34, maxZoom: 1.05, includeDetails: true });
          }
        }, [mode, setViewportForIds]);

        const resetLayout = useCallback(() => {
          setResetNonce(value => value + 1);
          focusMode("overview");
        }, [focusMode]);

        const toggleTheme = useCallback(() => {
          setTheme(value => (value === "dark" ? "light" : "dark"));
        }, []);

        const toggleDetails = useCallback(() => {
          setShowDetails(value => !value);
        }, []);

        const beginCanvasNavigation = useCallback(event => {
          if (event?.target?.closest?.(".react-flow__controls")) return;
          if (navigationTimer.current) window.clearTimeout(navigationTimer.current);
          setIsNavigating(true);
        }, []);

        const endCanvasNavigation = useCallback(() => {
          if (navigationTimer.current) window.clearTimeout(navigationTimer.current);
          navigationTimer.current = window.setTimeout(() => setIsNavigating(false), 180);
        }, []);

        useEffect(() => {
          document.body.classList.add("app-ready");
          return () => document.body.classList.remove("app-ready");
        }, []);

        useEffect(() => {
          document.documentElement.dataset.theme = theme;
          try {
            window.localStorage.setItem("visual-arch-theme", theme);
          } catch (_error) {
            // Storage is optional for a static document.
          }
        }, [theme]);

        useEffect(() => {
          return () => {
            if (navigationTimer.current) window.clearTimeout(navigationTimer.current);
          };
        }, []);

        useEffect(() => {
          const onHashChange = () => {
            const id = hashSelectionId();
            if (NODE_BY_ID[id]) {
              setSelectedId(id);
              centerNode(id);
            } else {
              setSelectedId(null);
            }
          };
          window.addEventListener("hashchange", onHashChange);
          return () => window.removeEventListener("hashchange", onHashChange);
        }, [centerNode]);

        useEffect(() => {
          if (didInitialFit.current) return;
          didInitialFit.current = true;
          replaceUrlHash(null);
          window.setTimeout(
            () => setViewportForIds(BOARD.views.overview.focus, { padding: 0.18, maxZoom: 0.95, reservePanel: false, duration: 0 }),
            0
          );
        }, [setViewportForIds]);

        return h(
          "div",
          { className: `app-shell ${isNavigating ? "is-navigating" : ""}` },
          h(Toolbar, {
            mode,
            selectedId,
            showDetails,
            theme,
            onModeChange: focusMode,
            onFitAll: fitAll,
            onResetLayout: resetLayout,
            onClearSelection: clearSelection,
            onDetailsToggle: toggleDetails,
            onThemeToggle: toggleTheme
          }),
          h(
            "div",
            {
              className: "flow-wrap",
              onPointerDown: beginCanvasNavigation,
              onPointerUp: endCanvasNavigation,
              onPointerLeave: endCanvasNavigation,
              onPointerCancel: endCanvasNavigation
            },
            h(
              ReactFlow,
              {
                nodes,
                edges,
                nodeTypes,
                edgeTypes,
                defaultViewport: viewportForIds(BOARD.views.overview.focus, { padding: 0.18, maxZoom: 0.95, reservePanel: false }),
                minZoom: 0.28,
                maxZoom: 1.45,
                nodesDraggable: false,
                nodesConnectable: false,
                nodesFocusable: true,
                edgesFocusable: false,
                elementsSelectable: true,
                panOnDrag: true,
                panOnScroll: false,
                zoomOnScroll: true,
                zoomOnPinch: true,
                zoomOnDoubleClick: false,
                preventScrolling: true,
                selectionOnDrag: false,
                deleteKeyCode: null,
                connectOnClick: false,
                onNodeClick: (_event, node) => {
                  if (NODE_BY_ID[node.id]) selectNode(node.id);
                },
                onInit: instance => {
                  window.setTimeout(() => {
                    instance.setViewport(
                      viewportForIds(BOARD.views.overview.focus, { padding: 0.18, maxZoom: 0.95, reservePanel: false }),
                      { duration: 0 }
                    );
                  }, 0);
                },
                onPaneClick: clearSelection,
                onMoveEnd: endCanvasNavigation,
                defaultEdgeOptions: {
                  type: "contract",
                  markerEnd: { type: MarkerType.ArrowClosed }
                },
                proOptions: { hideAttribution: true }
              },
              h(Background, { variant: "lines", gap: 34, size: 0.75, color: "var(--grid)" }),
              h(Controls, { position: "bottom-left", showInteractive: false })
            )
          ),
          h(DetailDrawer, { mode, selectedId, onSelect: selectNode, onClose: clearSelection })
        );
      }

      function App() {
        return h(ReactFlowProvider, null, h(FlowBoard));
      }

      createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
