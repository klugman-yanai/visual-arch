    <title>Visual Architecture</title>
    <link rel="stylesheet" href="https://unpkg.com/@xyflow/react@12.10.2/dist/style.css" />
    <style>
      :root {
        color-scheme: light;
        --canvas: #f7f6f2;
        --canvas-strong: #ece9df;
        --surface: #fffefa;
        --ink: #171717;
        --muted: #625f58;
        --quiet: #8a857c;
        --line: #d8d4c8;
        --panel: rgba(255, 254, 250, 0.92);
        --shadow: 0 20px 58px rgba(34, 31, 24, 0.14);
        --grid: rgba(93, 88, 76, 0.09);
        --ok: #1c7c5c;
        --warn: #9a6b21;
        --unknown: #6b7280;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #24231f;
        --canvas-strong: #302e29;
        --surface: #302f2a;
        --ink: #f3eee4;
        --muted: #c8c0b1;
        --quiet: #a89f91;
        --line: #565247;
        --panel: rgba(48, 47, 42, 0.92);
        --shadow: 0 22px 64px rgba(0, 0, 0, 0.34);
        --grid: rgba(228, 220, 205, 0.08);
        --ok: #61c8a2;
        --warn: #e1b85a;
        --unknown: #a8b0b8;
      }
      * { box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body {
        overflow: hidden;
        background: var(--canvas);
        color: var(--ink);
        font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      button { font: inherit; }
      .app {
        position: relative;
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(circle at 8% 8%, rgba(66, 99, 190, 0.10), transparent 28rem),
          radial-gradient(circle at 88% 12%, rgba(18, 137, 112, 0.09), transparent 30rem),
          var(--canvas);
      }
      #boot-fallback {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 28px;
        background: var(--canvas);
      }
      body.app-ready #boot-fallback { display: none; }
      .fallback-card {
        max-width: 680px;
        border: 1px solid rgba(120, 113, 100, 0.18);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 24px;
      }
      .fallback-card h1 { margin: 0 0 8px; font-size: clamp(1.8rem, 5vw, 3.2rem); line-height: 1; }
      .fallback-card p { margin: 8px 0 0; color: var(--muted); }
      .topbar {
        position: absolute;
        inset: 14px 14px auto 14px;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) minmax(280px, 1.5fr) auto;
        gap: 12px;
        align-items: center;
        border: 1px solid rgba(120, 113, 100, 0.18);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 14px 34px rgba(34, 31, 24, 0.10);
        padding: 10px 12px;
        backdrop-filter: blur(14px);
      }
      .kicker {
        display: block;
        color: var(--quiet);
        font-size: 0.68rem;
        font-weight: 850;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .title {
        display: block;
        margin-top: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 1.05rem;
        font-weight: 900;
      }
      .subtitle {
        display: block;
        margin-top: 3px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font-size: 0.78rem;
      }
      .tabs, .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .search {
        min-height: 34px;
        min-width: 180px;
        border: 1px solid rgba(120, 113, 100, 0.22);
        border-radius: 6px;
        background: color-mix(in srgb, var(--surface) 84%, transparent);
        color: var(--ink);
        padding: 7px 9px;
        font: inherit;
        font-size: 0.82rem;
      }
      .button {
        min-height: 34px;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        padding: 7px 10px;
        font-size: 0.82rem;
        font-weight: 800;
        white-space: nowrap;
      }
      .button:hover { border-color: rgba(120, 113, 100, 0.28); background: rgba(127, 127, 127, 0.08); }
      .button.active { background: var(--ink); color: var(--surface); }
      .button.icon { display: inline-grid; width: 34px; place-items: center; padding-inline: 0; }
      .flow { width: 100%; height: 100%; }
      .lane {
        width: var(--lane-width);
        height: var(--lane-height);
        border-inline: 1px solid rgba(120, 113, 100, 0.18);
        border-top: 4px solid var(--accent);
        background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 8%, transparent), transparent 68%);
        pointer-events: none;
      }
      .lane-title {
        padding: 14px 18px;
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 950;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .node {
        width: 220px;
        min-height: 86px;
        border: 1px solid color-mix(in srgb, var(--accent) 42%, #afa99d);
        border-top: 5px solid var(--accent);
        border-radius: 8px;
        background: color-mix(in srgb, var(--soft) 38%, var(--surface));
        box-shadow: 0 12px 30px rgba(34, 31, 24, 0.10);
        color: var(--ink);
        overflow: hidden;
      }
      .node.selected { box-shadow: 0 22px 52px rgba(34, 31, 24, 0.20), 0 0 0 4px color-mix(in srgb, var(--accent) 19%, transparent); }
      .node.dimmed { opacity: 0.34; filter: saturate(0.7); }
      .node-domain {
        padding: 10px 12px 0;
        color: color-mix(in srgb, var(--accent) 78%, var(--ink));
        font-size: 0.62rem;
        font-weight: 950;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .node h3 { margin: 7px 12px 0; font-size: 1.14rem; line-height: 1.12; }
      .node p { margin: 7px 12px 12px; color: var(--muted); font-size: 0.82rem; }
      .confidence {
        display: inline-flex;
        width: fit-content;
        max-width: calc(100% - 24px);
        margin: 9px 12px 0;
        border: 1px solid color-mix(in srgb, var(--confidence-color, var(--unknown)) 32%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--confidence-color, var(--unknown)) 10%, transparent);
        color: color-mix(in srgb, var(--confidence-color, var(--unknown)) 86%, var(--ink));
        padding: 3px 7px;
        font-size: 0.62rem;
        font-weight: 950;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .drawer {
        position: absolute;
        z-index: 18;
        top: 88px;
        right: 14px;
        width: min(500px, calc(100vw - 28px));
        max-height: calc(100vh - 108px);
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(120, 113, 100, 0.18);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(16px);
      }
      .drawer-head { border-top: 5px solid var(--accent); border-bottom: 1px solid rgba(120, 113, 100, 0.16); padding: 16px 18px; }
      .drawer h2 { margin: 7px 0 0; font-size: 1.45rem; line-height: 1.05; }
      .drawer p, .drawer li { color: var(--muted); }
      .drawer-body { overflow: auto; padding: 6px 18px 18px; }
      .section { border-bottom: 1px solid rgba(120, 113, 100, 0.14); padding: 13px 0; }
      .section:last-child { border-bottom: 0; }
      .section h3 { margin: 0; color: var(--quiet); font-size: 0.72rem; font-weight: 950; letter-spacing: 0.12em; text-transform: uppercase; }
      .section ul { margin: 9px 0 0; padding-left: 18px; }
      .sources { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
      .source { border: 1px solid rgba(120, 113, 100, 0.18); border-radius: 6px; padding: 6px 8px; font: 0.74rem ui-monospace, SFMono-Regular, Consolas, monospace; }
      .legend {
        position: absolute;
        left: 14px;
        bottom: 92px;
        z-index: 12;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        max-width: min(620px, calc(100vw - 28px));
        border: 1px solid rgba(120, 113, 100, 0.18);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 12px 28px rgba(34, 31, 24, 0.1);
        padding: 9px;
        backdrop-filter: blur(14px);
      }
      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 800;
      }
      .legend-swatch { width: 9px; height: 9px; border-radius: 999px; background: var(--legend-color); }
      @media (max-width: 760px) {
        .topbar { grid-template-columns: 1fr; }
        .drawer { top: auto; bottom: 14px; max-height: 46vh; }
        .legend { display: none; }
      }
    </style>
  </head>

      const { createElement: h, useCallback, useMemo, useState } = React;

            h("div", null, h("span", { className: "kicker" }, "Visual architecture"), h("span", { className: "title" }, ARCHITECTURE_MODEL.title), h("span", { className: "subtitle" }, ARCHITECTURE_MODEL.subtitle || "")),
            h("div", { className: "tabs" }, Object.entries(ARCHITECTURE_MODEL.views).map(([key, value]) => h("button", { key, className: `button ${view === key ? "active" : ""}`, onClick: () => { setView(key); setSelectedId(value.focus[0]); setTimeout(fit, 0); } }, value.label))),
