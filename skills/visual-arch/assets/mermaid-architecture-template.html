<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visual Architecture</title>
    <style>
      :root { color-scheme: light; --bg: #f7f6f2; --panel: #fffefa; --ink: #171717; --muted: #625f58; --line: #d8d4c8; }
      @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg: #24231f; --panel: #302f2a; --ink: #f3eee4; --muted: #c8c0b1; --line: #565247; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
      header { border-bottom: 1px solid var(--line); background: var(--panel); padding: 18px 22px; }
      h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.6rem); line-height: 1.05; }
      .subtitle { margin: 7px 0 0; color: var(--muted); }
      .content { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, 0.8fr); gap: 18px; padding: 18px; }
      .diagram, .details { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 16px; overflow: auto; }
      .mermaid { min-width: 720px; }
      h2 { margin: 0 0 10px; font-size: 1rem; }
      details { border-top: 1px solid var(--line); padding: 10px 0; }
      details:first-of-type { border-top: 0; }
      summary { cursor: pointer; font-weight: 850; }
      p, li { color: var(--muted); }
      code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.88em; }
      @media (max-width: 860px) { .content { grid-template-columns: 1fr; } .mermaid { min-width: 580px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 id="title">Project Architecture</h1>
        <p id="subtitle" class="subtitle">Replace the architecture model with project-specific data.</p>
      </header>
      <section class="content">
        <div class="diagram">
          <pre class="mermaid" id="diagram">flowchart LR
  entrypoint[Entrypoint] -->|call| runtime[Runtime]
  runtime -->|result| output[Output]</pre>
        </div>
        <aside class="details" id="details"></aside>
      </section>
    </main>
    <script type="application/json" id="architecture-model">
      {
        "title": "Project Architecture",
        "subtitle": "Replace this model with project-specific data.",
        "domains": {
          "system": { "label": "System", "color": "#4263be", "soft": "#dfe6ff" },
          "runtime": { "label": "Runtime", "color": "#128970", "soft": "#dff7ef" },
          "external": { "label": "External", "color": "#9a6b21", "soft": "#f6ebcf" }
        },
        "owners": {
          "project": { "label": "Project", "description": "Core project responsibility." },
          "external": { "label": "External", "description": "External dependency or user-operated system." }
        },
        "lanes": [
          { "id": "lane-system", "title": "System Boundary", "domain": "system", "x": 0, "y": 0, "width": 0, "height": 0 }
        ],
        "nodes": [
          { "id": "entrypoint", "title": "Entrypoint", "domain": "system", "owner": "project", "x": 0, "y": 0, "purpose": "The first project-specific execution surface.", "details": { "summary": "Replace this placeholder node with a real entrypoint.", "inputs": ["User or automation request"], "outputs": ["Runtime action"], "why": "Shows where the system starts.", "failures": ["Check the entrypoint source"], "source": ["replace-with/source-path"], "related": ["runtime"] } },
          { "id": "runtime", "title": "Runtime", "domain": "runtime", "owner": "project", "x": 0, "y": 0, "purpose": "The main execution path.", "details": { "summary": "Replace this placeholder node with real runtime behavior.", "inputs": ["Entrypoint call"], "outputs": ["Result or artifact"], "why": "Shows the central behavior.", "failures": ["Check runtime logs/tests"], "source": ["replace-with/source-path"], "related": ["output"] } },
          { "id": "output", "title": "Output", "domain": "external", "owner": "external", "x": 0, "y": 0, "purpose": "The visible result or handoff.", "details": { "summary": "Replace this placeholder node with a real output.", "inputs": ["Runtime result"], "outputs": ["User-visible artifact"], "why": "Shows what the system produces.", "failures": ["Check output validation"], "source": ["replace-with/source-path"], "related": ["runtime"] } }
        ],
        "edges": [
          { "id": "entrypoint-runtime", "source": "entrypoint", "target": "runtime", "label": "call", "kind": "control" },
          { "id": "runtime-output", "source": "runtime", "target": "output", "label": "result", "kind": "data" }
        ],
        "views": {
          "overview": { "label": "Overview", "focus": ["entrypoint", "runtime", "output"] }
        }
      }
    </script>
    <script type="module">
      import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
      const model = JSON.parse(document.getElementById("architecture-model").textContent);
      document.title = model.title;
      document.getElementById("title").textContent = model.title;
      document.getElementById("subtitle").textContent = model.subtitle || "";
      const nodeById = Object.fromEntries(model.nodes.map(node => [node.id, node]));
      const label = value => String(value).replaceAll('"', "'");
      const appendText = (parent, tag, text) => {
        const element = document.createElement(tag);
        element.textContent = text;
        parent.append(element);
        return element;
      };
      const appendListText = (parent, title, items) => {
        const paragraph = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = `${title}: `;
        paragraph.append(strong, items.join(", "));
        parent.append(paragraph);
      };
      const lines = ["flowchart LR"];
      for (const node of model.nodes) lines.push(`  ${node.id}["${label(node.title)}"]`);
      for (const edge of model.edges) lines.push(`  ${edge.source} -->|"${label(edge.label)}"| ${edge.target}`);
      document.getElementById("diagram").textContent = lines.join("\n");
      const detailsPanel = document.getElementById("details");
      detailsPanel.replaceChildren();
      appendText(detailsPanel, "h2", "Architecture Details");
      for (const node of model.nodes) {
        const details = node.details;
        const section = document.createElement("details");
        section.open = true;
        appendText(section, "summary", node.title);
        appendText(section, "p", details.summary);
        appendListText(section, "Reads", details.inputs);
        appendListText(section, "Writes", details.outputs);
        appendListText(section, "Why", [details.why]);
        appendListText(section, "Check first", details.failures);
        const sources = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = "Sources: ";
        sources.append(strong);
        for (const source of details.source) {
          const code = document.createElement("code");
          code.textContent = source;
          sources.append(code, " ");
        }
        section.append(sources);
        detailsPanel.append(section);
      }
      mermaid.initialize({ startOnLoad: true, securityLevel: "strict", theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default" });
      await mermaid.run();
    </script>
  </body>
</html>
